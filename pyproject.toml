[project]
name = "gev-workspace"
version = "0.1.1"
description = "gev — umbrella workspace: the `gev` decision model and the `gevbench` harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "gevbench",
    "gev",
]

[project.optional-dependencies]
train = ["gev[train]"]
serve = ["gev[serve]"]
modal = ["gev[modal]"]
demo = ["gevbench[demo]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    # Resolve the SDK rather than the local modal/ directory during type checking.
    "modal>=1.0",
]

[tool.uv.sources]
gevbench = { workspace = true }
gev = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages/gevbench/tests", "packages/gev/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
